site_name: HarnessGateway
site_description: Every coding agent behind one OpenAI Responses API, sandboxed, with the harness package in charge of the mapping.
site_url: https://harnessgateway.ai/docs/
repo_url: https://github.com/HarnessGateway/harnessgateway
repo_name: HarnessGateway/harnessgateway
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: harnessgateway/docs          # ships in the wheel; the API serves it at /docs
strict: true

theme:
  name: material
  favicon: assets/picky.png
  logo: assets/picky.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Overview: index.md
  - Get started:
      - Deploy: deploy.md
      - First boot and sign-in: initialize.md
      - The console: console.md
      - Providers: providers.md
      - Harnesses: harnesses.md
      - Requests: requests.md
  - Use it:
      - Conversations and sessions: conversations.md
      - Rodeo: rodeo.md
      - Teams, members and keys: teams.md
      - The hg command line: cli.md
      - The API: api.md
  - Packages:
      - Write a package: packages.md
      - The catalog: catalog/index.md
      - Claude Code: catalog/claude-code.md
      - Cline: catalog/cline.md
      - Codex: catalog/codex.md
      - Command Code: catalog/command-code.md
      - DeepSeek Harness: catalog/dsh.md
      - Hermes Agent: catalog/hermes.md
      - Kilo Code: catalog/kilo.md
      - Oh My Pi: catalog/omp.md
      - OpenClaw: catalog/openclaw.md
      - Pi: catalog/pi.md
      - Template: catalog/template.md
      - The Responses wire: responses-wire.md
  - Operate it:
      - Organizations and limits: organizations.md
      - Workers and scale: workers.md
      - Configuration: configuration.md
      - Security: security.md
      - Troubleshooting: troubleshooting.md
      - Contributing and releases: contributing.md
