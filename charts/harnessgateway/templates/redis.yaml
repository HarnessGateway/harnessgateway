{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hg.fullname" . }}-redis
  labels: {{- include "hg.labels" . | nindent 4 }}
spec:
  selector: {{- include "hg.select" (dict "ctx" . "c" "redis") | nindent 4 }}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
# Nothing durable lives in Redis (moments and the job queue): no volume, no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hg.fullname" . }}-redis
  labels: {{- include "hg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "hg.select" (dict "ctx" . "c" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "hg.select" (dict "ctx" . "c" "redis") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: [redis-server, --save, "", --appendonly, "no", --maxmemory, {{ .Values.redis.maxmemory | quote }},
                    --maxmemory-policy, noeviction]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
{{- end }}
