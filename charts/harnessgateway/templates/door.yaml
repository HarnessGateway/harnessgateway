# Every box's only way out: box pods reach it as hg-door (a hosts entry on the Service's cluster IP), on its port only.
# Its CA derives from the secret key, so any replica serves any box.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hg.fullname" . }}-door
  labels: {{- include "hg.labels" . | nindent 4 }}
spec:
  selector: {{- include "hg.select" (dict "ctx" . "c" "door") | nindent 4 }}
  ports: [{name: door, port: {{ .Values.door.port }}, targetPort: door}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hg.fullname" . }}-door
  labels: {{- include "hg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.door.replicas }}
  selector:
    matchLabels: {{- include "hg.select" (dict "ctx" . "c" "door") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "hg.select" (dict "ctx" . "c" "door") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum | trunc 16 }}
    spec:
      {{- include "hg.podCommon" . | nindent 6 }}
      automountServiceAccountToken: false
      {{- with .Values.door.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.door.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "hg.waitFor" (dict "ctx" . "name" "api" "host" (printf "%s-api" (include "hg.fullname" .)) "port" .Values.api.service.port) | nindent 8 }}
      containers:
        - name: door
          image: {{ include "hg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [door]
          env: {{- include "hg.doorEnv" . | nindent 12 }}
          ports: [{name: door, containerPort: {{ .Values.door.port }}}]
          readinessProbe:
            tcpSocket: {port: door}
            periodSeconds: 5
          {{- include "hg.containerSecurity" . | nindent 10 }}
          resources: {{- toYaml .Values.door.resources | nindent 12 }}
          volumeMounts: {{- include "hg.commonMounts" . | nindent 12 }}
      volumes: {{- include "hg.commonVolumes" . | nindent 8 }}
