{{- $ns := include "hg.boxesNamespace" . }}
{{- if .Values.boxes.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "hg.labels" . | nindent 4 }}
    # box pods meet the restricted Pod Security Standard: non-root, no capabilities, no escalation, RuntimeDefault seccomp
    pod-security.kubernetes.io/enforce: restricted
---
{{- end }}
# The fence: a box pod takes no connection and opens one only to the door's pods, on the door's port. No DNS, no api,
# no other pod, no metadata endpoint, no internet but through the door. The worker proves it at start-up.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hg.fullname" . }}-boxes
  namespace: {{ $ns }}
  labels: {{- include "hg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions: [{key: harnessgateway.box, operator: Exists}]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {{- include "hg.select" (dict "ctx" . "c" "door") | nindent 14 }}
      ports: [{protocol: TCP, port: {{ .Values.door.port }}}]
{{- if .Values.boxes.createRuntimeClass }}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.boxes.runtimeClassName }}
  labels: {{- include "hg.labels" . | nindent 4 }}
handler: runsc
{{- end }}
