{{- if not .Values.secrets.existingSecret }}
{{- /* Generated once: an upgrade reads the Secret back, so the keys (which seal every organization's data) never change. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (include "hg.fullname" .)) | default dict }}
{{- $d := (get $old "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hg.fullname" . }}
  labels: {{- include "hg.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ get $d "secret-key" | default (randBytes 32 | b64enc) }}
  door-key: {{ get $d "door-key" | default (printf "hgd_%s" (randAlphaNum 43) | b64enc) }}
  operator-key: {{ get $d "operator-key" | default (printf "hgo_%s" (randAlphaNum 43) | b64enc) }}
  db-password: {{ get $d "db-password" | default (randAlphaNum 32 | b64enc) }}
  postgres-password: {{ get $d "postgres-password" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
