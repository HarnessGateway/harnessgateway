{{- $ns := include "hg.boxesNamespace" . }}
{{- $sa := printf "%s-worker" (include "hg.fullname" .) }}
# The worker's rights: box pods and their Secrets in the boxes namespace, nothing elsewhere but reading the door's
# Service (its cluster IP becomes each box's hg-door) and the RuntimeClass (checked at start-up).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels: {{- include "hg.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  labels: {{- include "hg.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $sa }}}
subjects: [{kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }}}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  labels: {{- include "hg.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [{{ include "hg.fullname" . }}-door]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  labels: {{- include "hg.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $sa }}}
subjects: [{kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }}}]
{{- if eq .Values.sandbox.runtime "runsc" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $sa }}
  labels: {{- include "hg.labels" . | nindent 4 }}
rules:
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [{{ .Values.boxes.runtimeClassName }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ $sa }}
  labels: {{- include "hg.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Namespace }}-{{ $sa }}}
subjects: [{kind: ServiceAccount, name: {{ $sa }}, namespace: {{ .Release.Namespace }}}]
{{- end }}
