[project]
name = "harnessgateway"
version = "4.1.0"
description = "Runs any agent harness CLI in a sandbox, behind the OpenAI Responses API."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary,pool]",
    "pydantic",
    "openai",
    "cryptography",
    "httpx",
    "python-multipart",
    "certifi",
]

[project.scripts]
harnessgateway = "harnessgateway.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessgateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.per-file-target-version]
"harnessgateway/kit/hgkit.py" = "py39"      # the kit runs in any environment image, on Python 3.9 or later

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"harnessgateway/store/**" = ["S608"]        # SQL is assembled from this code's own constants; values are always parameters
"tests/**" = ["S104", "S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
strict = true
files = ["harnessgateway"]
