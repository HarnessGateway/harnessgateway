[project]
name = "harnessgateway"
version = "1.0.0"
description = "HarnessGateway: run any coding-agent harness in a platform-owned sandbox behind the OpenAI Responses API."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "openai==3.37.0",                # the Responses schema packages are validated against
    "psycopg[binary,pool]>=3.2,<4",
    "boto3>=1.34,<2",
    "cryptography>=42",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
aws = []
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
harnessgateway = "harnessgateway.__main__:main"

[project.urls]
Homepage = "https://harnessgateway.ai"
Source = "https://github.com/HarnessGateway/harnessgateway"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessgateway"]

[tool.hatch.build.targets.wheel.force-include]
packages = "harnessgateway/builtin"

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "--import-mode=importlib"           # every package has its own tests/test_map.py
markers = [
    "integration: needs Postgres, S3 and Docker (run with HG_TEST_STACK=1)",
    "live: calls real model providers (run with HG_TEST_LIVE=1)",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S104", "S603", "S607", "S608", "B008"]   # S104: bind addresses are settings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]
"harnessgateway/node/**" = ["S108"]          # /tmp paths are inside the sandbox
"skills/**" = ["S310"]                        # urlopen of the package's own provider URL
"packages/**" = ["S310", "S108"]           # /tmp paths are inside the sandbox
