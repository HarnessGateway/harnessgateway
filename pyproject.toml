[project]
name = "harnessgateway"
version = "1.1.2"
description = "Coding-agent harnesses as an API: OpenAI Responses in, sandboxed harness packages, Responses out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "openai==3.37.0",                # the Responses schema requests and package output are validated against
    "psycopg[binary,pool]>=3.2,<4",
    "boto3>=1.34,<2",                # adapters only: the s3:// object store and the KMS key wrapper
    "cryptography>=42",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
harnessgateway = "harnessgateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessgateway"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "--import-mode=importlib"
pythonpath = [".", "sandbox"]                # hgkit, as the sandbox image has it on PYTHONPATH
asyncio_mode = "auto"
markers = ["integration: needs a live stack (HG_TEST_STACK=1)"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S104", "S603", "S607", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]
"packages/**" = ["S108", "S310"]
"console/**" = ["S108"]
"sandbox/**" = ["S108"]
"harnessgateway/node/**" = ["S108"]
"harnessgateway/adapters/sandbox_docker.py" = ["S108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["harnessgateway", "sandbox/hgkit"]
