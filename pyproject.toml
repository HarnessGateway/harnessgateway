[project]
name = "harnessgateway"
version = "3.0.2"
description = "Any coding-agent harness as an API: OpenAI Responses in, a sandboxed harness package, Responses out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "openai==3.45.0",                # the Responses schema requests and package output are validated against
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5.0,<9",
    "boto3>=1.34,<2",                # adapters only: the s3:// object store and the KMS key wrapper
    "cryptography>=42",
    "httpx>=0.27,<1",
    "authlib>=1.3,<2",               # OIDC: discovery, the code exchange, ID token verification
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "playwright>=1.45", "types-redis"]

[project.scripts]
harnessgateway = "harnessgateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harnessgateway", "sandbox/hgkit", "sandbox/hgsnapshot"]   # shared with packages and the runner

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
norecursedirs = ["seeds", ".*"]
addopts = "--import-mode=importlib"
pythonpath = [".", "sandbox"]
asyncio_mode = "auto"
markers = ["integration: needs a live stack (HG_TEST_STACK=1)"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["packages/*/seeds"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S104", "S603", "S607", "S608", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "B017"]
"packages/**" = ["S108", "S310"]
"console/**" = ["S108"]
"sandbox/**" = ["S108", "S310"]
"harnessgateway/door/**" = ["S108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["harnessgateway", "sandbox/hgkit", "sandbox/runner.py"]
