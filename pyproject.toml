[project]
name = "harnessgateway"
dynamic = ["version"]                # the newest section of CHANGELOG.md
description = "HarnessGateway: coding-agent harnesses behind the OpenAI Responses API, sandboxed, driven by the packages organizations bring."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["cryptography>=42", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "httpx>=0.27",
                "openai>=3.35", "psycopg[binary]>=3.1", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[server]>=5"]

[project.scripts]
harnessgateway = "harnessgateway.__main__:main"
hg = "harnessgateway.cli:main"

[project.urls]
Homepage = "https://harnessgateway.ai"
Source = "https://github.com/HarnessGateway/harnessgateway"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "CHANGELOG.md"
pattern = '^## \[(?P<version>[^\]]+)\]'

[tool.hatch.build.targets.wheel]
packages = ["harnessgateway"]
artifacts = ["harnessgateway/docs"]        # the built documentation site is ignored by git but ships

[tool.hatch.build.targets.wheel.force-include]
catalog = "harnessgateway/catalog"
# The documentation site is built into harnessgateway/docs by `mkdocs build` (see mkdocs.yml) and
# ships in the wheel from there; the API serves it at /docs.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon"]
