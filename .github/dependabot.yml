# What goes stale on its own: the Python lock, the two images' pinned base digests, the compose stack's service images,
# the chat's CDN libraries, and the actions the workflows run. One pull request a week per ecosystem; CI decides
# whether it merges. Not covered here: the built-in harness's CLI (.github/workflows/freshness.yml checks it).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: npm
    directory: /console/chat                           # a manifest of the CDN libraries; scripts/sync-cdn-libs applies a bump
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directories: ["/", "/sandbox"]
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]     # the workflows, and the composite action they share
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
