name: release
# The changelog is the release. On every push to main this reads the top entry of CHANGELOG.md; when its version has
# no tag yet, it builds the platform and sandbox images for amd64 and arm64, pushes them to GHCR as
# ghcr.io/harnessgateway/harnessgateway:<version> and ghcr.io/harnessgateway/sandbox:<version> (and :latest) — the
# names deploy/install.sh, compose and the node default to — then tags v<version> and publishes the entry as the
# release notes. A push to main whose top entry is already tagged does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reissue:
        description: "Rebuild and publish the version even if its tag exists (moves the tag to this commit)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/version-check
      - id: read
        run: |
          version=$(grep -m1 -oP '^## \[\K\d[^\]]*' CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.reissue }}" = "true" ]; then
            echo "reissuing v$version"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$version"; echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - name: harnessgateway
            context: .
          - name: sandbox
            context: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/harnessgateway/${{ matrix.name }}:${{ needs.version.outputs.version }}
            ghcr.io/harnessgateway/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  publish:
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release notes from the changelog entry
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          test -s notes.md
      - name: tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v$VERSION" -m "HarnessGateway $VERSION" "$GITHUB_SHA"
          git push -f origin "refs/tags/v$VERSION"
          gh release delete "v$VERSION" --yes 2>/dev/null || true   # left by a deleted tag, or being reissued
          gh release create "v$VERSION" --title "HarnessGateway $VERSION" --notes-file notes.md --verify-tag
