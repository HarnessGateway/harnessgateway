name: release
# The changelog is the release. On every push to main this reads the top entry of CHANGELOG.md; when its version has
# no tag yet, it builds the platform and sandbox images for amd64 and arm64, pushes them to GHCR as
# ghcr.io/harnessgateway/harnessgateway:<version> and ghcr.io/harnessgateway/sandbox:<version> (and :latest), the
# names deploy/install.sh and compose default to, then tags v<version> and publishes the entry as the release notes.
# A push to main whose top entry is already tagged does nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reissue:
        description: "Rebuild and publish the version even if its tag exists (moves the tag to this commit)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write          # build provenance, attested and pushed beside each image
  attestations: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/version-check
      - id: read
        run: |
          version=$(grep -m1 -oP '^## \[\K\d[^\]]*' CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.reissue }}" = "true" ]; then
            echo "reissuing v$version"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$version"; echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - name: harnessgateway
            file: Dockerfile
          - name: sandbox
            file: sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/harnessgateway/${{ matrix.name }}:${{ needs.version.outputs.version }}
            ghcr.io/harnessgateway/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/harnessgateway/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: release notes from the changelog's top entry
        run: |
          awk '/^## \[/{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
      - run: |
          git tag -f "v${{ needs.version.outputs.version }}"
          git push -f origin "v${{ needs.version.outputs.version }}"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          body_path: notes.md
