name: security
# Both images scanned with Trivy and the Python dependencies audited against the advisory databases: on every change
# and weekly, since a vulnerability can be published against an image that has not changed. Fixed CRITICAL and HIGH
# findings fail the run; findings with no fix available are reported, not failed on.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: harnessgateway
            file: Dockerfile
          - name: sandbox
            file: sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t scan/${{ matrix.name }}:${{ github.sha }} -f ${{ matrix.file }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: audit the locked dependencies against the advisory databases
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/requirements.txt
          .venv/bin/pip-audit --progress-spinner off --disable-pip --no-deps -r /tmp/requirements.txt
