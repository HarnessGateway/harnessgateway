name: security
# Both images scanned with Trivy and the Python dependencies audited against the advisory databases: on every change
# and weekly, since a vulnerability can be published against an image that has not changed. Fixed CRITICAL and HIGH
# findings fail the run; findings with no fix available are reported, not failed on.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: harnessgateway
            file: Dockerfile
          - name: sandbox
            file: sandbox/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scan/${{ matrix.name }}:${{ github.sha }} -f ${{ matrix.file }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m venv .venv && .venv/bin/pip install -q -e ".[dev]" pip-audit
      - run: .venv/bin/pip-audit --progress-spinner off --skip-editable
