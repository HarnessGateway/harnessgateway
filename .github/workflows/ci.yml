name: ci
# Every level of the checks (unit, integration, end to end), and the image built and scanned. It also runs every
# week: a vulnerability can be published against an image that has not changed.
on:
  push:
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hg
          POSTGRES_PASSWORD: hg
          POSTGRES_DB: hg_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hg" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Every console file parses as the module it is (it has no build step to catch one)
        run: find console -name "*.js" | while read -r file; do node --input-type=module --check < "$file" || { echo "$file"; exit 1; }; done
      - run: uv run pytest tests/unit tests/shipped tests/integration
        env:
          HG_TEST_DATABASE_URL: postgresql://hg:hg@localhost:5432/hg_test

  # A whole platform as a user installs it: the image built from this tree, installed from it alone (SPEC.md
  # section 14.2), then real turns in real containers, every page of the console in a real browser, an update in
  # place, and the extension chain in a browser. The run removes what it made.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hg
          POSTGRES_PASSWORD: hg
          POSTGRES_DB: hg_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hg" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: A browser, for the console's checks
        run: |
          npm install --global playwright
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"
      - name: Every end-to-end check
        run: tests/e2e/run.sh
        env:
          HG_TEST_DATABASE_URL: postgresql://hg:hg@localhost:5432/hg_test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t harnessgateway:ci .
      - name: The image runs, says what it is, and holds the console and what an installation starts with
        run: |
          docker run --rm harnessgateway:ci harnessgateway --version
          docker run --rm harnessgateway:ci harnessgateway compose | grep -q "ghcr.io/harnessgateway/harnessgateway:$(docker run --rm harnessgateway:ci harnessgateway --version)"
          docker run --rm harnessgateway:ci python -c "
          from harnessgateway import defaults, shipped
          from harnessgateway.domain.package import read_archive
          for found in (shipped.folder('console') / 'index.html', shipped.folder('environments') / 'default.json',
                        shipped.contract() / 'request.schema.json'):
              assert found.is_file(), found
          print({name: read_archive(defaults.archive(name)).digest[:12] for name in defaults.names()})"
      # Fixed CRITICAL and HIGH findings fail the run; findings with no fix yet are reported, not failed on.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25    # v0.36.0
        with:
          image-ref: harnessgateway:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
