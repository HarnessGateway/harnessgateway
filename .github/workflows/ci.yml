name: ci
on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
      - run: scripts/version-check
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest -q tests/unit packages
      - name: no forbidden words
        run: '! grep -rIil "harness""router" --exclude-dir=.git --exclude-dir=.venv . | grep -v "^./AGENTS.md$"'

  services:
    # the services on a real Postgres, and the console in a browser on a real API
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
      - run: .venv/bin/playwright install --with-deps chromium
      - run: .venv/bin/pytest -q tests/services tests/e2e
        env:
          HG_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

  images:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t harnessgateway:ci .
      - run: docker build -t harnessgateway-sandbox:ci sandbox/
      - run: docker run --rm harnessgateway:ci --version
