name: ci
# Every level of the test plan (SPEC §24) that a hosted runner can run, and both images built and scanned. It also
# runs every week: a vulnerability can be published against an image that has not changed.
on:
  push:
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      HG_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy
      - name: A browser, for the console's test
        run: |
          npm install --global playwright
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"
      - name: Unit, integration and browser tests
        run: uv run pytest
      - name: End-to-end tests, in real containers
        run: uv run pytest tests/e2e
        env:
          HG_TEST_DOCKER: "1"

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f images/platform/Dockerfile -t harnessgateway:ci .
      - run: docker build -f images/sandbox/Dockerfile -t sandbox:ci images/sandbox
      - name: The platform image runs, and its catalog holds the template package
        run: |
          docker run --rm harnessgateway:ci harnessgateway version
          docker run --rm harnessgateway:ci harnessgateway package check /packages/shell
      - name: The sandbox image has what the shipped harnesses need, as user 10000, and nothing that raises privileges
        run: |
          docker run --rm --user 10000:10000 --read-only --tmpfs /tmp:rw,exec --entrypoint /bin/sh sandbox:ci -c '
            set -e
            test "$(id -u)" = 10000
            node --version && npm --version
            python3 -c "import sys; assert sys.version_info >= (3, 12), sys.version"
            python3 -m venv /tmp/venv && /tmp/venv/bin/pip --version
            git --version && curl --version >/dev/null && rg --version >/dev/null && jq --version
            if command -v apk || command -v busybox; then echo "a package manager or BusyBox is left"; exit 1; fi
            test -z "$(find / -xdev -type f -perm /6000 2>/dev/null)"'
      # Fixed CRITICAL and HIGH findings fail the run; findings with no fix yet are reported, not failed on.
      - name: Scan the platform image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25    # v0.36.0
        with:
          image-ref: harnessgateway:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the sandbox image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25    # v0.36.0
        with:
          image-ref: sandbox:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
