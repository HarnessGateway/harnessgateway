name: ci
on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

concurrency:                            # a new push to the same branch replaces the run in progress
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e '.[dev]'
      - run: .venv/bin/ruff check .
      - name: unit and package mapper tests
        run: .venv/bin/pytest -q tests/unit packages

  integration:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: gVisor
        run: sudo deploy/node/install-gvisor.sh
      - name: images
        run: |
          docker build -t harnessgateway/platform:1 .
          docker build -t harnessgateway/sandbox:1 sandbox/
      - name: database                  # started after gVisor: installing it restarts Docker
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=root postgres:16-alpine
          until docker exec pg pg_isready -U postgres -h 127.0.0.1; do sleep 1; done
      - name: object storage
        run: docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=ci -e RUSTFS_SECRET_KEY=cisecret123 rustfs/rustfs:1.0.4
      - name: database role
        run: |
          PGPASSWORD=root psql -h 127.0.0.1 -U postgres -c "CREATE ROLE hg LOGIN PASSWORD 'hg' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE hg OWNER hg"
      - name: stack
        run: |
          uv venv --python 3.12 && uv pip install -e '.[dev]'
          cat > ci.env <<EOF
          HG_DATABASE_URL=postgresql://hg:hg@127.0.0.1:5432/hg
          HG_SECRET_KEY=$(openssl rand -hex 32)
          HG_OPERATOR_KEY=hgo_ci
          HG_NODE_JOIN_TOKEN=hgj_$(openssl rand -hex 24)
          HG_S3_ENDPOINT=http://127.0.0.1:9000
          HG_S3_BUCKET=hg-ci
          HG_S3_ACCESS_KEY=ci
          HG_S3_SECRET_KEY=cisecret123
          HG_API_URL=http://127.0.0.1:8000
          HG_GATEWAY_URL=http://172.17.0.1:8081
          HG_NODE_DIR=/tmp/hg-node
          EOF
          set -a; . ./ci.env; set +a
          nohup .venv/bin/harnessgateway serve --role api,gateway > api.log 2>&1 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8000/readyz && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/readyz || { echo "::error::the api did not become ready"; exit 1; }
          sudo -E env "PATH=$PATH" nohup .venv/bin/harnessgateway serve --role node > node.log 2>&1 &
      - name: integration tests
        timeout-minutes: 20
        run: HG_TEST_API=http://127.0.0.1:8000 HG_TEST_OPERATOR_KEY=hgo_ci HG_TEST_DATABASE_URL=postgresql://hg:hg@127.0.0.1:5432/hg .venv/bin/pytest tests/integration -v
      - name: logs
        if: always()
        run: tail -n 200 api.log node.log || true
