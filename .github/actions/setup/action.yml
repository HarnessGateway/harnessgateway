name: set up the checkout
description: Python 3.12 with the pip cache, a virtual environment at .venv, and the package installed with its dev extras. Every job that runs Python starts here.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml
    - run: python -m venv .venv && .venv/bin/pip install -q -U pip && .venv/bin/pip install -q -e ".[dev]"
      shell: bash
