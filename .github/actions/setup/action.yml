name: set up the checkout
description: uv with Python 3.14, and the project synced into .venv exactly as uv.lock pins it, dev group included. Every job that runs Python starts here.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        enable-cache: true
    - run: uv sync --frozen
      shell: bash
