<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · HarnessGateway</title>
<link rel="icon" href="/static/mascot.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login">
<form class="lbox" id="f">
  <div class="brand"><img class="logo" src="/static/mascot.png" alt=""><b>HarnessGateway</b></div>
  <div id="msg" class="note" hidden></div>
  <div id="sso" hidden><a class="btn" id="ssogo" style="width:100%;justify-content:center" href="/api/sso/start">Sign in with SSO</a><div class="help" id="ssohelp" style="text-align:center;margin:10px 0"></div></div>
  <div id="signin">
    <div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" autofocus required></div>
    <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
  </div>
  <div id="setup" hidden>
    <div class="field"><label>Choose a password</label><input name="new" type="password" autocomplete="new-password" minlength="12"><div class="help">at least 12 characters</div></div>
    <div class="field"><label>Again</label><input name="again" type="password" autocomplete="new-password"></div>
  </div>
  <button class="btn" id="go" style="width:100%;justify-content:center">Sign in</button>
  <div class="help" id="local" hidden style="text-align:center;margin-top:10px"><a href="?local=1">Sign in with a password instead</a></div>
</form>
<script type="module" src="/static/login.js"></script>
</body>
</html>
