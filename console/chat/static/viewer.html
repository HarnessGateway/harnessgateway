<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer</title>
<style>
:root { --bg:#ffffff; --text:#0d0d0d; --muted:#8f8f8f; --line:#e5e5e5; --head:#f6f6f6; --page:#f4f4f4; --tab:#ececec; }
:root[data-theme="dark"] { --bg:#212121; --text:#ececec; --muted:#8f8f8f; --line:#3a3a3a; --head:#2a2a2a; --page:#181818; --tab:#303030; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
body.auto { background:transparent; }
.note { padding:40px 24px; text-align:center; color:var(--muted); }
.diagram { display:flex; justify-content:center; padding:16px; }
.diagram svg { max-width:100%; height:auto; }
.paper { background:var(--page); min-height:100vh; padding:24px 16px; }
.docx { background:#fff; color:#111; max-width:816px; margin:0 auto; padding:72px 80px; box-shadow:0 1px 4px rgba(0,0,0,.15); line-height:1.5; }
.docx img { max-width:100%; }
.docx table { border-collapse:collapse; margin:12px 0; }
.docx td, .docx th { border:1px solid #ccc; padding:4px 8px; vertical-align:top; }
.tabs { position:sticky; top:0; display:flex; gap:4px; padding:8px; background:var(--bg); border-bottom:1px solid var(--line); overflow-x:auto; }
.tabs button { font:inherit; color:var(--text); background:none; border:0; padding:4px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; }
.tabs button.on { background:var(--tab); }
.sheet table { border-collapse:collapse; font-size:13px; }
.sheet td, .sheet th { border:1px solid var(--line); padding:4px 10px; white-space:nowrap; text-align:left; }
.sheet tr:first-child td { background:var(--head); font-weight:600; position:sticky; top:var(--top, 0); }
.limit { padding:8px 12px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="out"><div class="note">Loading…</div></div>
<script src="static/viewer.js"></script>
</body>
</html>
