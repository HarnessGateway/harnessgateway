<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer</title>
<style>
:root { --bg: #ffffff; --ink: #1b1a19; --muted: #6e6b66; --line: #e8e6e3; --sunk: #f4f4f2; }
:root[data-theme="dark"] { --bg: #171718; --ink: #ededee; --muted: #9a9aa2; --line: #29292c; --sunk: #1e1e20; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.note { padding: 40px 24px; text-align: center; color: var(--muted); }
.diagram { display: flex; justify-content: center; padding: 16px; } .diagram svg { max-width: 100%; height: auto; }
.paper { background: var(--sunk); min-height: 100vh; padding: 24px 16px; }
.docx { background: #fff; color: #111; max-width: 816px; margin: 0 auto; padding: 72px 80px; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); line-height: 1.5; }
.docx img { max-width: 100%; } .docx table { border-collapse: collapse; margin: 12px 0; } .docx td, .docx th { border: 1px solid #ccc; padding: 4px 8px; vertical-align: top; }
.tabs { position: sticky; top: 0; display: flex; gap: 4px; padding: 8px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font: inherit; color: var(--ink); background: none; border: 0; padding: 4px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--sunk); }
.sheet table { border-collapse: collapse; font-size: 13px; } .sheet td, .sheet th { border: 1px solid var(--line); padding: 4px 10px; white-space: nowrap; text-align: left; }
.sheet tr:first-child td { background: var(--sunk); font-weight: 600; }
.limit { padding: 8px 12px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="out"><div class="note">Loading…</div></div>
<script src="viewer.js"></script>
</body>
</html>
