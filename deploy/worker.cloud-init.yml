#cloud-config
# A worker machine on any provider: Docker, the sandboxed runtime, and the worker role joining the
# control plane. Fill in HG_CONTROL_URL, HG_JOIN_TOKEN, HG_GATEWAY_URL (the gateway as this machine's
# doors reach it: a TLS address behind your load balancer) and, if the image is private, a pull.
package_update: true
packages: [ca-certificates, curl]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - curl -fsSL https://github.com/google/gvisor/releases/latest/download/runsc -o /usr/local/bin/runsc || true
  - chmod +x /usr/local/bin/runsc && /usr/local/bin/runsc install && systemctl restart docker || true
  - >
    docker run -d --name hg-worker --restart unless-stopped
    -v /var/run/docker.sock:/var/run/docker.sock -v hg:/data
    -e HG_CONTROL_URL=https://hg.example.com -e HG_JOIN_TOKEN=CHANGE-ME
    -e HG_GATEWAY_URL=https://gateway.hg.example.com -e HG_RUNTIME=runsc -e HG_WORKER_SLOTS=4
    ghcr.io/harnessgateway/harnessgateway:7 serve --role worker
