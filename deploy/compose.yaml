# HarnessGateway self-hosted on one host (SPEC §6, §15): `install.sh` sets it up; by hand:
#
#   cp .env.example .env    # then fill it: docker run --rm ghcr.io/harnessgateway/harnessgateway:3.3.1 keygen >> .env
#   docker compose up -d --wait
#   docker compose exec api harnessgateway init --admin-email you@example.com
#                           # prints, once, the first admin's invitation link and an admin key for automation
#
# Services: postgres (records), redis (moments and the job queue), api, worker (launches boxes on this host's Docker),
# door (every box's only way out, named hg-door: the worker joins it to each box's network) and console (:8800).
# Boxes are sibling containers started by the worker; their directories live under HG_BOX_DIR on the host, mounted
# into the worker at the same path. Objects go to a volume unless HG_BLOB_URL names an S3-compatible store.
name: harnessgateway

x-platform: &platform
  image: ${HG_PLATFORM_IMAGE:-ghcr.io/harnessgateway/harnessgateway:3.3.1}
  restart: unless-stopped

x-env: &env
  HG_DATABASE_URL: postgresql://harnessgateway:${HG_DB_PASSWORD}@postgres:5432/harnessgateway
  HG_REDIS_URL: redis://redis:6379/0
  HG_BLOB_URL: ${HG_BLOB_URL:-file:///var/lib/harnessgateway-objects}
  HG_SECRET_KEY: ${HG_SECRET_KEY:?set HG_SECRET_KEY in .env (harnessgateway keygen)}
  HG_OPERATOR_KEY: ${HG_OPERATOR_KEY:-}
  HG_DOOR_KEY: ${HG_DOOR_KEY:?set HG_DOOR_KEY in .env (harnessgateway keygen)}
  HG_API_URL: http://api:8000
  HG_DOOR: hg-door:3128
  HG_CONSOLE_URL: ${HG_CONSOLE_URL:-http://localhost:8800}
  HG_SMTP_URL: ${HG_SMTP_URL:-}
  HG_MAIL_FROM: ${HG_MAIL_FROM:-}
  HG_ALLOW_PRIVATE_EGRESS: ${HG_ALLOW_PRIVATE_EGRESS:-0}
  HG_UPSTREAM_PROXY: ${HG_UPSTREAM_PROXY:-}
  HG_CA_FILE: ${HG_CA_FILE:-}
  HG_SANDBOX_IMAGE: ${HG_SANDBOX_IMAGE:-ghcr.io/harnessgateway/sandbox:3.3.1}
  HG_PLATFORM_IMAGE: ${HG_PLATFORM_IMAGE:-ghcr.io/harnessgateway/harnessgateway:3.3.1}
  HG_EXTENSIONS: ${HG_EXTENSIONS:-}
  HG_LOG_LEVEL: ${HG_LOG_LEVEL:-info}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  postgres:
    # the major an existing installation runs stays until its operator moves the data (docs/operations.md, Upgrade);
    # install.sh writes HG_POSTGRES_IMAGE into a new .env, so a new installation starts on the current major
    image: ${HG_POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:?set POSTGRES_ROOT_PASSWORD in .env}
      HG_DB_PASSWORD: ${HG_DB_PASSWORD:?set HG_DB_PASSWORD in .env}
      # the data directory, the same on every major: 18+ images otherwise default to a per-major directory and refuse
      # to start with a volume at this path, while an existing installation's data already lives here
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-harnessgateway.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harnessgateway"]
      interval: 5s
      retries: 30
    networks: [backend]

  redis:
    image: ${HG_REDIS_IMAGE:-redis:8-alpine}      # nothing durable lives in it: the current major, always
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${HG_REDIS_MAXMEMORY:-512mb}",
              "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30
    networks: [backend]

  api:
    <<: *platform
    command: ["api"]
    environment: *env
    volumes:
      - objects:/var/lib/harnessgateway-objects
    ports:
      - "${HG_BIND:-127.0.0.1}:${HG_HTTP_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      retries: 60
    networks: [backend, uplink]

  worker:
    <<: *platform
    command: ["worker"]
    user: "0:0"                 # the Docker socket, and box directories handed to the sandbox user
    environment:
      <<: *env
      HG_BOX_DIR: ${HG_BOX_DIR:-/var/lib/harnessgateway/boxes}
      HG_SANDBOX_RUNTIME: ${HG_SANDBOX_RUNTIME:-runsc}
      HG_DOOR_CONTAINER: hg-door
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - objects:/var/lib/harnessgateway-objects
      - ${HG_BOX_DIR:-/var/lib/harnessgateway/boxes}:${HG_BOX_DIR:-/var/lib/harnessgateway/boxes}
    depends_on:
      api: {condition: service_healthy}
    networks: [backend]

  door:
    <<: *platform
    container_name: hg-door
    command: ["door"]
    environment:
      HG_SECRET_KEY: ${HG_SECRET_KEY}
      HG_DOOR_KEY: ${HG_DOOR_KEY}
      HG_API_URL: http://api:8000
      HG_DOOR: hg-door:3128
      HG_UPSTREAM_PROXY: ${HG_UPSTREAM_PROXY:-}
      HG_CA_FILE: ${HG_CA_FILE:-}
      HG_ALLOW_PRIVATE_EGRESS: ${HG_ALLOW_PRIVATE_EGRESS:-0}
      HG_LOG_LEVEL: ${HG_LOG_LEVEL:-info}
    depends_on:
      api: {condition: service_healthy}
    networks: [uplink]

  console:
    <<: *platform
    entrypoint: ["python", "/opt/harnessgateway/console/server.py"]
    command: ["--host", "0.0.0.0", "--port", "8800"]
    environment:
      HG_API: http://api:8000
      HG_CONSOLE_DIR: /var/lib/harnessgateway-console    # drafts: packages being written in the console
    volumes:
      - console:/var/lib/harnessgateway-console
    ports:
      - "${HG_BIND:-127.0.0.1}:${HG_CONSOLE_PORT:-8800}:8800"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/login')"]
      interval: 5s
      retries: 30
    networks: [backend]

networks:
  backend:
  uplink:                       # the api and the door; every box's own network is joined by the door only
    name: hg-uplink

volumes:
  postgres:
  objects:
  console:
